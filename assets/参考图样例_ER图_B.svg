<text x="740.0" y="716.8" font-size="19" font-family="Microsoft YaHei" fill="#000000" text-anchor="middle">联系类型：一个客户签订多个订单，一个订单只属一个客户（1∶N）；一种农产品可出现在多个订单中，一次订单只订购一种农产品（1∶N）</text>
<text x="740.0" y="748.8" font-size="19" font-family="Microsoft YaHei" fill="#000000" text-anchor="middle">主关键字：客户编号、订单编号、农产品编号；订单实体中的客户编号与农产品编号作为外部关键字</text>
